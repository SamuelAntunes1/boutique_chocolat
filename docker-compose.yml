services:
  db:
    # image officielle, pas de build
    image: mysql:8
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

  backend:
    # utilise backend/Dockerfile
    build: ./backend
    env_file: .env
    depends_on:
      - db
    networks:
      - backend-net
      - frontend-net

  nginx:
    # utilise nginx/Dockerfile
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - frontend-net

volumes:
  db_data:

networks:
  backend-net:
  frontend-net: